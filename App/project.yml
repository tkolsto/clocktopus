name: Clocktopus
options:
  bundleIdPrefix: no.kolsto
  deploymentTarget:
    macOS: "13.0"
packages:
  ClocktopusCore:
    path: ../Core
targets:
  Clocktopus:
    type: application
    platform: macOS
    sources: [Sources, Resources]
    dependencies:
      - package: ClocktopusCore
    entitlements:
      path: Clocktopus.entitlements
      properties:
        # Required to send Apple Events (browser active-tab query) under the
        # hardened runtime. macOS still prompts for each target app.
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.kolsto.clocktopus
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES   # menubar app: no Dock icon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Clocktopus reads the active tab URL of your frontmost browser to match your time to the right project."
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
  ClocktopusTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Clocktopus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.kolsto.clocktopus.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
schemes:
  Clocktopus:
    build:
      targets:
        Clocktopus: all
        ClocktopusTests: [test]
    test:
      targets:
        - ClocktopusTests
